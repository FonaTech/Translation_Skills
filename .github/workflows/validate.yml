name: Validate portable skill
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-core.txt -r requirements-optional.txt pytest
      - run: python tools/validate.py
      - run: python -m pytest tests -q
      - run: python tools/checksums.py
  windows-encoding:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    env:
      PYTHONUTF8: '0'
      PYTHONIOENCODING: cp936
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-core.txt
      - run: python -X utf8=0 -m unittest discover -s tests -p test_runtime_encoding.py -v
