 function table(wrap){

   if(fits()){headerPlaced=true;continue;}
   rr.remove();

 newPage();
 function place(el){if(el.classList.contains('paragraph'))paragraph(el);else if(el.classList.contains('table-wrap'))table(el);else if(el.classList.contains('pair')){for(const child of el.children)place(child);}else atomic(el);}

 const wanted=[...source.querySelectorAll('[data-uid]')].map(x=>x.dataset.uid);const got=new Set([...stage.querySelectorAll('[data-uid]')].map(x=>x.dataset.uid));

}
window.addEventListener('load',()=>paginate().catch(e=>{window.translationError=String(e);console.error(e);}));
